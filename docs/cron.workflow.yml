# v2.13: drives /api/cron/tick (protein nudges, fasting-goal notices, Monday check-ins, web push).
# Repo secrets the owner sets: CRON_URL (e.g. https://<host>/api/cron/tick) and CRON_SECRET (the
# same value as the server's CRON_SECRET env var). Without them the job exits quietly.
name: cron-tick

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/tick
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "CRON_URL / CRON_SECRET not set; skipping."
            exit 0
          fi
          status=$(curl -sS -o /tmp/tick.json -w '%{http_code}' --max-time 120 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" "$CRON_URL")
          echo "HTTP $status"
          head -c 2000 /tmp/tick.json; echo
          if [ "$status" -ge 400 ]; then exit 1; fi
